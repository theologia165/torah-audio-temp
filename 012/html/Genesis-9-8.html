<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#fff}body{padding:20px 8px 52px;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}.row{direction:rtl;display:flex;flex-wrap:wrap;gap:18px 13px;padding:0 8px;line-height:1.03;align-items:flex-start}.unit{position:relative;display:flex;flex-direction:column;align-items:center;min-width:34px;padding:1px 2px;outline:none}.hw{font-family:"Noto Serif Hebrew","Times New Roman",serif;font-size:clamp(38px,6.2vw,46px);direction:rtl}.gl{direction:ltr;font-size:12px;margin-top:5px;white-space:nowrap}.pun{font-family:"Noto Serif Hebrew","Times New Roman",serif;font-size:clamp(38px,6.2vw,46px)}.pop{display:none;position:fixed;z-index:50;background:white;border:1px solid #ddd;border-radius:10px;padding:9px 11px;box-shadow:0 4px 18px #0002;font-size:12px;line-height:1.5;direction:ltr;max-width:min(260px,86vw)}.pop b{display:block;font-size:1.3em}.pop span{display:block}.unit:hover .pop,.unit:focus .pop{display:block}@media(max-width:600px){.hw,.pun{font-size:clamp(36px,11vw,44px)}.gl{font-size:12px}}</style><body><div class="row"><span class="unit" tabindex="0"><span class="hw">וַיֹּ֤אמֶר</span><span class="gl">そして言った</span><span class="pop"><b>H559</b><span>品詞：動詞</span><span>語幹：Qal</span><span>活用：Vqw3ms</span></span></span><span class="unit" tabindex="0"><span class="hw">אֱלֹהִים֙</span><span class="gl">神は</span><span class="pop"><b>H430</b><span>品詞：名詞</span><span>語幹：—</span><span>活用：Ncmpa</span></span></span><span class="unit" tabindex="0"><span class="hw">אֶל</span><span class="gl">〜に</span><span class="pop"><b>H413</b><span>品詞：前置詞</span><span>語幹：—</span><span>活用：R</span></span></span><span class="pun">־</span><span class="unit" tabindex="0"><span class="hw">נֹ֔חַ</span><span class="gl">ノア</span><span class="pop"><b>H5146</b><span>品詞：名詞</span><span>語幹：—</span><span>活用：Np</span></span></span><span class="unit" tabindex="0"><span class="hw">וְאֶל</span><span class="gl">そして〜に</span><span class="pop"><b>H413</b><span>品詞：前置詞</span><span>語幹：—</span><span>活用：R</span></span></span><span class="pun">־</span><span class="unit" tabindex="0"><span class="hw">בָּנָ֥יו</span><span class="gl">彼の息子たち</span><span class="pop"><b>H1121</b><span>品詞：機能語</span><span>語幹：—</span><span>活用：Sp3ms</span></span></span><span class="unit" tabindex="0"><span class="hw">אִתּ֖וֹ</span><span class="gl">彼と共に</span><span class="pop"><b>H854</b><span>品詞：機能語</span><span>語幹：—</span><span>活用：Sp3ms</span></span></span><span class="unit" tabindex="0"><span class="hw">לֵאמֹֽר</span><span class="gl">言って</span><span class="pop"><b>H559</b><span>品詞：動詞</span><span>語幹：Qal</span><span>活用：Vqc</span></span></span><span class="pun">׃</span></div><script>const units=[...document.querySelectorAll('.unit')];function place(u){const p=u.querySelector('.pop');p.style.display='block';const r=u.getBoundingClientRect(),pr=p.getBoundingClientRect();let x=Math.max(8,Math.min(innerWidth-pr.width-8,r.left+r.width/2-pr.width/2));let y=Math.max(8,Math.min(innerHeight-pr.height-8,r.bottom+6));p.style.left=x+'px';p.style.top=y+'px'}units.forEach(u=>{u.addEventListener('mouseenter',()=>place(u));u.addEventListener('mouseleave',()=>u.querySelector('.pop').style.display='');u.addEventListener('focus',()=>place(u));u.addEventListener('blur',()=>u.querySelector('.pop').style.display='');u.addEventListener('click',e=>{e.stopPropagation();units.forEach(x=>{if(x!==u)x.querySelector('.pop').style.display=''});place(u)})});document.addEventListener('click',()=>units.forEach(u=>u.querySelector('.pop').style.display=''));</script></body></html>
