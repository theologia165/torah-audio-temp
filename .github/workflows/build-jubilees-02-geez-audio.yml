name: Build Jubilees 2 Ge'ez AI audio

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-jubilees-02-geez-audio.yml'
      - 'jubilees/02/source/**'

permissions:
  contents: write

concurrency:
  group: jubilees-02-geez-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      MODEL: gpt-4o-mini-tts
      VOICE: cedar
      SPEED: '0.70'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify API secret is available
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "OPENAI_API_KEY is not configured in repository Actions secrets."
            exit 1
          fi

      - name: Generate one MP3 per verse
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p jubilees/02/audio
          instructions="Use a solemn, very slow and unhurried liturgical reading cadence inspired broadly by traditional Ethiopian church scripture reading. This is an AI pronunciation study, not an imitation of a particular cleric. Read only the provided Classical Ethiopic (Ge'ez) text. Pronounce every fidel distinctly, do not translate, do not add a verse number or commentary, and pause naturally at phrase boundaries."

          printf 'verse\tfile\tmodel\tvoice\tspeed\tgenerated_utc\tsha256\n' > jubilees/02/audio/metadata.tsv

          tail -n +2 jubilees/02/source/geez-verses.tsv |
          while IFS=$'\t' read -r verse geez; do
            [[ -n "$verse" && -n "$geez" ]] || continue
            verse_slug="${verse/:/-}"
            output="jubilees/02/audio/jubilees-${verse_slug}-geez-ai.mp3"
            temporary="${output}.tmp"

            payload="$(jq -n \
              --arg model "$MODEL" \
              --arg voice "$VOICE" \
              --arg input "$geez" \
              --arg instructions "$instructions" \
              --argjson speed "$SPEED" \
              '{model:$model,voice:$voice,input:$input,instructions:$instructions,response_format:"mp3",speed:$speed}')"

            status="$(curl --silent --show-error \
              --output "$temporary" \
              --write-out '%{http_code}' \
              https://api.openai.com/v1/audio/speech \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H 'Content-Type: application/json' \
              --data "$payload")"

            if [[ "$status" != "200" ]]; then
              echo "Speech generation failed for verse $verse (HTTP $status)."
              cat "$temporary"
              exit 1
            fi

            if [[ ! -s "$temporary" ]] || [[ "$(stat -c%s "$temporary")" -lt 1000 ]]; then
              echo "Generated audio for verse $verse is unexpectedly small."
              exit 1
            fi

            mv "$temporary" "$output"
            checksum="$(sha256sum "$output" | cut -d' ' -f1)"
            generated="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$verse" "$output" "$MODEL" "$VOICE" "$SPEED" "$generated" "$checksum" \
              >> jubilees/02/audio/metadata.tsv
          done

      - name: Repair and validate Jubilees 2:1 from short clauses
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          output='jubilees/02/audio/jubilees-2-1-geez-ai.mp3'
          instructions="Read only the supplied Classical Ethiopic (Ge'ez) phrase. Use a solemn, very slow, unhurried scripture-reading cadence inspired broadly by Ethiopian liturgical reading. Pronounce every fidel distinctly. Do not translate, add words, or stop before the end of the phrase."

          : > "$work/clauses.txt"
          tail -n +2 jubilees/02/source/geez-2-1-clauses.tsv |
          while IFS=        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jubilees/02/audio
          if git diff --cached --quiet; then
            echo 'No generated audio changes to commit.'
          else
            git commit -m "Generate Jubilees 2:1-3 Ge'ez AI readings"
            git pull --rebase
            git push
          fi
\t' read -r sequence geez; do
            [[ -n "$sequence" && -n "$geez" ]] || continue
            clause="$work/clause-${sequence}.wav"
            payload="$(jq -n \
              --arg model "$MODEL" --arg voice "$VOICE" --arg input "$geez" \
              --arg instructions "$instructions" --argjson speed "$SPEED" \
              '{model:$model,voice:$voice,input:$input,instructions:$instructions,response_format:"wav",speed:$speed}')"
            status="$(curl --silent --show-error --output "$clause.tmp" --write-out '%{http_code}' \
              https://api.openai.com/v1/audio/speech \
              -H "Authorization: Bearer $OPENAI_API_KEY" -H 'Content-Type: application/json' --data "$payload")"
            [[ "$status" == '200' ]] || { echo "Clause $sequence failed (HTTP $status)."; cat "$clause.tmp"; exit 1; }
            mv "$clause.tmp" "$clause"
            seconds="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$clause")"
            awk -v d="$seconds" 'BEGIN { exit !(d >= 1.5) }' || { echo "Clause $sequence too short: $seconds"; exit 1; }
            printf "file '%s'\n" "$clause" >> "$work/clauses.txt"
          done

          [[ "$(find "$work" -name 'clause-*.wav' | wc -l)" -eq 4 ]] || { echo 'Expected four clauses.'; exit 1; }
          ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=channel_layout=mono:sample_rate=24000 -t 0.65 "$work/silence.wav"
          awk -v silence="$work/silence.wav" '{ lines[NR]=$0 } END { for (i=1;i<=NR;i++) { print lines[i]; if(i<NR) printf "file '\''%s'\''\n", silence } }' \
            "$work/clauses.txt" > "$work/with-pauses.txt"
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i "$work/with-pauses.txt" -c:a libmp3lame -b:a 64k "$output.tmp"
          mv "$output.tmp" "$output"

          duration="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$output")"
          awk -v d="$duration" 'BEGIN { exit !(d >= 15) }' || { echo "Final 2:1 audio too short: $duration"; exit 1; }
          checksum="$(sha256sum "$output" | cut -d' ' -f1)"
          generated="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          awk -F '\t' -v OFS='\t' -v file="$output" -v model="$MODEL" -v voice="$VOICE" -v speed="$SPEED" \
            -v generated="$generated" -v checksum="$checksum" '
              NR==1 {print; next}
              $1=="2:1" {print "2:1",file,model,voice,speed,generated,checksum; next}
              {print}
            ' jubilees/02/audio/metadata.tsv > "$work/metadata.tsv"
          mv "$work/metadata.tsv" jubilees/02/audio/metadata.tsv
          printf 'verse\tduration_seconds\tclauses\tspeed\tmethod\n2:1\t%s\t4\t%s\tclause-generation-and-concatenation\n' \
            "$duration" "$SPEED" > jubilees/02/audio/jubilees-2-1-geez-ai.audit.tsv
          echo "Validated repaired 2:1 audio: $duration seconds."

      - name: Commit generated MP3 files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jubilees/02/audio
          if git diff --cached --quiet; then
            echo 'No generated audio changes to commit.'
          else
            git commit -m "Generate Jubilees 2:1-3 Ge'ez AI readings"
            git pull --rebase
            git push
          fi
