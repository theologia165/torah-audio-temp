name: Build Jubilees 2 Ge'ez AI audio

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-jubilees-02-geez-audio.yml'
      - 'jubilees/02/source/**'

permissions:
  contents: write

concurrency:
  group: jubilees-02-geez-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      MODEL: gpt-4o-mini-tts
      VOICE: cedar
      SPEED: '0.70'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify API secret is available
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "OPENAI_API_KEY is not configured in repository Actions secrets."
            exit 1
          fi

      - name: Generate one MP3 per verse
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p jubilees/02/audio
          instructions="Use a solemn, very slow and unhurried liturgical reading cadence inspired broadly by traditional Ethiopian church scripture reading. This is an AI pronunciation study, not an imitation of a particular cleric. Read only the provided Classical Ethiopic (Ge'ez) text. Pronounce every fidel distinctly, do not translate, do not add a verse number or commentary, and pause naturally at phrase boundaries."

          printf 'verse\tfile\tmodel\tvoice\tspeed\tgenerated_utc\tsha256\n' > jubilees/02/audio/metadata.tsv

          tail -n +2 jubilees/02/source/geez-verses.tsv |
          while IFS=$'\t' read -r verse geez; do
            [[ -n "$verse" && -n "$geez" ]] || continue
            verse_slug="${verse/:/-}"
            output="jubilees/02/audio/jubilees-${verse_slug}-geez-ai.mp3"
            temporary="${output}.tmp"

            payload="$(jq -n \
              --arg model "$MODEL" \
              --arg voice "$VOICE" \
              --arg input "$geez" \
              --arg instructions "$instructions" \
              --argjson speed "$SPEED" \
              '{model:$model,voice:$voice,input:$input,instructions:$instructions,response_format:"mp3",speed:$speed}')"

            status="$(curl --silent --show-error \
              --output "$temporary" \
              --write-out '%{http_code}' \
              https://api.openai.com/v1/audio/speech \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H 'Content-Type: application/json' \
              --data "$payload")"

            if [[ "$status" != "200" ]]; then
              echo "Speech generation failed for verse $verse (HTTP $status)."
              cat "$temporary"
              exit 1
            fi

            if [[ ! -s "$temporary" ]] || [[ "$(stat -c%s "$temporary")" -lt 1000 ]]; then
              echo "Generated audio for verse $verse is unexpectedly small."
              exit 1
            fi

            mv "$temporary" "$output"
            checksum="$(sha256sum "$output" | cut -d' ' -f1)"
            generated="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$verse" "$output" "$MODEL" "$VOICE" "$SPEED" "$generated" "$checksum" \
              >> jubilees/02/audio/metadata.tsv
          done

      - name: Commit generated MP3 files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jubilees/02/audio
          if git diff --cached --quiet; then
            echo 'No generated audio changes to commit.'
          else
            git commit -m "Generate Jubilees 2:1-3 Ge'ez AI readings"
            git pull --rebase
            git push
          fi
