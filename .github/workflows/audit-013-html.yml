name: Audit 013 HTML morphology
on:
  push:
    branches: [main]
    paths:
      - '013/inspect_html_data.py'
      - '.github/workflows/audit-013-html.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python 013/inspect_html_data.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 013/morph-audit.tsv
          git diff --cached --quiet || (git commit -m 'Audit 013 MorphHB word data' && git push)
