name: Repair 013 Genesis 10:2-4 HTML
on:
  push:
    branches: [main]
    paths:
      - '013/repair_html_10_2_4.py'
      - '.github/workflows/repair-013-html-10-2-4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python 013/repair_html_10_2_4.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 013/html-fixed/Genesis-10-2-r3.html 013/html-fixed/Genesis-10-3-r3.html 013/html-fixed/Genesis-10-4-r3.html
          git diff --cached --quiet || (git commit -m 'Repair Genesis 10:2-4 interlinear gloss and morphology' && git push)
