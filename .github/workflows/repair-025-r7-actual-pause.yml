name: Repair 025 r7 actual inter-verse pauses

on:
  push:
    paths:
      - '.github/workflows/repair-025-r7-actual-pause.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[025-r7]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download source
        run: |
          set -euo pipefail
          mkdir -p 025/r7 025/r7-normal 025/source-r7
          curl -fL --retry 3 -o 025/source-r7/Vayera-4.mp3 https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/audio/Vayera-4.mp3
      - name: Write LOCKED actual-audio boundaries from Genesis 20:12 onward
        run: |
          cat > 025/boundaries-r7.tsv <<'EOF'
          boundary	candidate_pause_start	candidate_pause_end	adopted_cut	previous_final_word	next_opening_word	tail_complete	next_word_not_started	status	basis
          Genesis-20-11->Genesis-20-12	USER-VALIDATED	USER-VALIDATED	363.290000	LOCKED	LOCKED	true	true	LOCKED-user-validated	user confirmed Genesis 20:12 opening is correct
          Genesis-20-12->Genesis-20-13	373.873830	374.796170	374.760000	Genesis 20:12 final word	Genesis 20:13 opening	true	true	verified	broad actual-source pause; r6 cut at 373.382 truncated final word; adopted near pause-end before re-onset
          Genesis-20-13->Genesis-20-14	397.265000	397.927000	397.900000	Genesis 20:13 final word	Genesis 20:14 opening	true	true	verified	actual-source broad pause; adopted at late quiet portion before re-onset
          Genesis-20-14->Genesis-20-15	409.764000	411.927000	411.800000	Genesis 20:14 final word	Genesis 20:15 opening	true	true	verified	very broad actual-source pause; stronger-threshold quiet interval remains through about 411.827
          Genesis-20-15->Genesis-20-16	417.534000	419.147000	419.080000	Genesis 20:15 final word	Genesis 20:16 opening	true	true	verified	broad actual-source pause; multi-threshold pause ends cluster 419.106-419.147
          Genesis-20-16->Genesis-20-17	433.580000	434.542000	434.500000	Genesis 20:16 final word	Genesis 20:17 opening	true	true	verified	broad actual-source pause at 34/30 dB thresholds
          Genesis-20-17->Genesis-20-18	445.405000	446.251000	446.170000	Genesis 20:17 final word	Genesis 20:18 opening	true	true	verified	broad actual-source pause; stronger-threshold quiet tail ends around 446.179
          Genesis-20-18->Genesis-21-1	454.337000	456.529000	456.460000	Genesis 20:18 final word	Genesis 21:1 opening	true	true	verified	very broad actual-source pause; multi-threshold end cluster 456.483-456.529
          Genesis-21-1->Genesis-21-2	465.879000	466.413000	466.380000	Genesis 21:1 final word	Genesis 21:2 opening	true	true	verified	actual-source pause; multi-threshold end cluster 466.400-466.413
          Genesis-21-2->Genesis-21-3	477.930000	478.999000	478.970000	Genesis 21:2 final word	Genesis 21:3 opening	true	true	verified	strong-threshold broad pause ends consistently around 478.995-478.999; later weak-level activity not used as cut target
          Genesis-21-3->Genesis-21-4	486.648000	487.066000	487.040000	Genesis 21:3 final word	Genesis 21:4 opening	true	true	verified	actual-source quiet interval stable across 42/38/34/30 dB thresholds
          EOF
      - name: Build r7 from LOCKED boundaries only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, subprocess, pathlib
          root=pathlib.Path('025')
          bounds=list(csv.DictReader(open(root/'boundaries-r7.tsv',encoding='utf-8'),delimiter='\t'))
          refs=['Genesis-20-12','Genesis-20-13','Genesis-20-14','Genesis-20-15','Genesis-20-16','Genesis-20-17','Genesis-20-18','Genesis-21-1','Genesis-21-2','Genesis-21-3','Genesis-21-4']
          starts=[float(bounds[0]['adopted_cut'])] + [float(x['adopted_cut']) for x in bounds[1:]]
          total=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(root/'source-r7/Vayera-4.mp3')],text=True).strip())
          ends=[float(x['adopted_cut']) for x in bounds[1:]] + [total]
          atempo='0.692086'
          audit=['reference\tstart\tend\tsource_duration\tstudy_duration\tstatus']
          for ref,s,e in zip(refs,starts,ends):
              chap,verse=ref.replace('Genesis-','').split('-')
              normal=root/f'r7-normal/025-Genesis-{chap}-{verse}-r7-normal.mp3'
              study=root/f'r7/025-Genesis-{chap}-{verse}-r7-study.mp3'
              d=e-s
              assert d>1,(ref,s,e)
              subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y','-ss',f'{s:.6f}','-i',str(root/'source-r7/Vayera-4.mp3'),'-t',f'{d:.6f}','-c:a','libmp3lame','-q:a','2',str(normal)],check=True)
              subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y','-i',str(normal),'-filter:a',f'atempo={atempo}','-c:a','libmp3lame','-q:a','2',str(study)],check=True)
              actual=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(study)],text=True).strip())
              audit.append(f'{ref}\t{s:.6f}\t{e:.6f}\t{d:.6f}\t{actual:.6f}\tpass')
          (root/'repair-025-r7.log').write_text('\n'.join(audit)+'\n',encoding='utf-8')
          PY
      - name: Structural QA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open('025/boundaries-r7.tsv',encoding='utf-8'),delimiter='\t'))
          # User-validated start of 20:12 must not move.
          assert abs(float(rows[0]['adopted_cut'])-363.290)<1e-6
          # Every newly recalculated boundary must be in its actual-source pause, late in that pause but before pause end.
          for r in rows[1:]:
              s=float(r['candidate_pause_start']); e=float(r['candidate_pause_end']); c=float(r['adopted_cut'])
              assert s < c < e, r
              assert (c-s) > (e-s)*0.60, r
              assert r['tail_complete']=='true' and r['next_word_not_started']=='true' and r['status']=='verified'
          # Critical 20:12 boundary must be later than the known truncated r6 point and inside the broad pause.
          critical=rows[1]
          assert float(critical['adopted_cut']) > 374.70
          PY
      - name: Commit r7
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 025/r7 025/r7-normal 025/boundaries-r7.tsv 025/repair-025-r7.log
          git commit -m '[025-r7] Rebuild Genesis 20:12-21:4 from actual inter-verse pauses' || exit 0
          git push
