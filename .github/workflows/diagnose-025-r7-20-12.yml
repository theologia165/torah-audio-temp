name: Diagnose 025 r7 20:12 boundary

on:
  push:
    paths:
      - '.github/workflows/diagnose-025-r7-20-12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze actual audio around Genesis 20:12 -> 20:13
        run: |
          set -euo pipefail
          mkdir -p 025/r7-diagnostic
          curl -fL --retry 3 -o 025/r7-diagnostic/Vayera-4.mp3 https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/audio/Vayera-4.mp3
          ffmpeg -nostdin -hide_banner -loglevel error -ss 371.8 -t 3.0 -i 025/r7-diagnostic/Vayera-4.mp3 -ac 1 -ar 48000 -f s16le 025/r7-diagnostic/seg.pcm
          python3 - <<'PY'
          import array, math, pathlib
          p=pathlib.Path('025/r7-diagnostic/seg.pcm')
          a=array.array('h'); a.frombytes(p.read_bytes())
          sr=48000; win=int(sr*0.005)
          rows=['time\trms_dbfs\tpeak_dbfs']
          for i in range(0,len(a)-win+1,win):
              s=a[i:i+win]
              rms=(sum(x*x for x in s)/len(s))**0.5
              peak=max(abs(x) for x in s)
              def db(x): return -120.0 if x<=0 else 20*math.log10(x/32768.0)
              t=371.8+i/sr
              rows.append(f'{t:.3f}\t{db(rms):.2f}\t{db(peak):.2f}')
          pathlib.Path('025/r7-diagnostic/20-12-20-13-energy.tsv').write_text('\n'.join(rows)+'\n')
          PY
          for th in 46 42 38 34 30 26 22 18 14 10; do
            ffmpeg -nostdin -hide_banner -ss 371.8 -t 3.0 -i 025/r7-diagnostic/Vayera-4.mp3 -af silencedetect=noise=-${th}dB:d=0.015 -f null - 2>025/r7-diagnostic/silence-${th}.log || true
          done
          python3 - <<'PY'
          import re,pathlib
          root=pathlib.Path('025/r7-diagnostic')
          out=['threshold\tstart_abs\tend_abs\tduration']
          for th in [46,42,38,34,30,26,22,18,14,10]:
              txt=(root/f'silence-{th}.log').read_text(errors='ignore')
              starts=[float(x) for x in re.findall(r'silence_start: ([0-9.]+)',txt)]
              ends=[float(x) for x in re.findall(r'silence_end: ([0-9.]+)',txt)]
              for s,e in zip(starts,ends): out.append(f'{th}\t{371.8+s:.6f}\t{371.8+e:.6f}\t{e-s:.6f}')
          (root/'20-12-20-13-silences.tsv').write_text('\n'.join(out)+'\n')
          PY
          rm 025/r7-diagnostic/Vayera-4.mp3 025/r7-diagnostic/seg.pcm
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 025/r7-diagnostic
          git commit -m '[025-r7-diag] Fine analysis of Genesis 20:12 tail' || exit 0
          git push
