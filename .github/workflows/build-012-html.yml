name: Build 012 interactive HTML

on:
  push:
    paths:
      - '012/build_html.py'
      - '.github/workflows/build-012-html.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate HTML
        run: python3 012/build_html.py
      - name: Commit HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 012/html
          if ! git diff --cached --quiet; then
            git commit -m 'Build 012 interactive HTML'
            git push
          fi
