name: Build 028 Genesis 22 interactive Hebrew HTML

on:
  push:
    paths:
      - '.github/workflows/build-028-hebrew-html.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[028-html-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch OSHB/MorphHB and Hebrew lexicon
        run: |
          set -euo pipefail
          mkdir -p 028/html 028/source
          curl -fL --retry 3 -o 028/source/Gen.xml https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml
          curl -fL --retry 3 -o 028/source/HebrewStrong.xml https://raw.githubusercontent.com/openscriptures/HebrewLexicon/master/HebrewStrong.xml
      - name: Generate 24 interactive HTML files
        run: |
          python3 - <<'PY'
          import re, html, pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path('028')
          lexroot=ET.parse(root/'source/HebrewStrong.xml').getroot()
          lex={}
          for e in lexroot.iter():
              if e.tag.endswith('entry') and e.get('id','').startswith('H'):
                  w=next((x for x in e if x.tag.endswith('w') and (x.text or '').strip()),None)
                  if w is not None: lex[e.get('id')]=(w.text or '').strip()
          prefixes={'c':'וְ','d':'הַ','b':'בְּ','l':'לְ','m':'מִן','k':'כְּ'}
          def lemma_disp(raw,morph):
              out=[]
              for p in raw.split('/'):
                  p=p.strip()
                  if p in prefixes: out.append(prefixes[p]); continue
                  m=re.match(r'(\d+)',p)
                  if m: out.append(lex.get('H'+m.group(1),'H'+m.group(1)))
                  elif p: out.append(p)
              if '/S' in morph: out.append('代名詞接尾辞')
              return ' + '.join(out) if out else '—'
          def pos_disp(morph):
              labels=[]
              for c in morph.lstrip('H').split('/'):
                  if not c: continue
                  if c.startswith('C'): x='接続詞'
                  elif c.startswith('Td'): x='定冠詞'
                  elif c.startswith('To'): x='目的格標識'
                  elif c.startswith('Tr'): x='関係辞'
                  elif c.startswith('Ti'): x='疑問辞'
                  elif c.startswith('Tn'): x='否定辞'
                  elif c.startswith('T'): x='小辞'
                  elif c.startswith('R'): x='前置詞'
                  elif c.startswith('Np'): x='固有名詞'
                  elif c.startswith('N'): x='普通名詞'
                  elif c.startswith('A'): x='形容詞・数詞'
                  elif c.startswith('P'): x='代名詞'
                  elif c.startswith('D'): x='副詞'
                  elif c.startswith('V'): x='動詞'
                  elif c.startswith('S'): x='代名詞接尾辞'
                  else: x='形態要素'
                  if x not in labels: labels.append(x)
              return '＋'.join(labels) if labels else '—'
          stems={'q':'カル','N':'ニファル','p':'ピエル','P':'プアル','h':'ヒフィル','H':'ホファル','t':'ヒトパエル','v':'ヒシュタフェル'}
          def stem_disp(morph):
              for c in morph.lstrip('H').split('/'):
                  if c.startswith('V') and len(c)>1: return stems.get(c[1], 'MorphHB '+c[1])
              return '—'
          gen=ET.parse(root/'source/Gen.xml').getroot()
          chapter=next(x for x in gen.iter() if x.tag.endswith('chapter') and x.get('osisID')=='Gen.22')
          css='''<style>:root{color-scheme:light;--ink:#13243b;--gold:#b58a31}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink)}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;padding:30px 10px 70px;overflow-x:hidden}.verse{direction:rtl;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:flex-start;gap:20px 13px;max-width:100%;padding:0 12px;line-height:1.05}.token{position:relative;display:flex;flex:0 0 auto;min-width:30px;max-width:100%;flex-direction:column;align-items:center;cursor:pointer;outline:none;border-radius:8px;padding:2px 3px}.token:focus-visible{box-shadow:0 0 0 2px #d5ad53}.hebrew,.punct{font-family:"Noto Serif Hebrew","Times New Roman",serif;font-size:clamp(27px,5.1vw,36px);white-space:nowrap;color:#111b2c}.gloss{direction:ltr;font-size:10px;color:#6e7682;margin-top:7px;white-space:nowrap}.punct{padding-top:2px}.popup{display:none;position:fixed;z-index:50;width:min(250px,calc(100vw - 16px));direction:ltr;background:#071a33;color:#fff;border:1px solid #c8a65a;border-radius:12px;padding:10px 11px;box-shadow:0 12px 34px rgba(0,0,0,.3);font-size:11px;line-height:1.45}.popup.show{display:block}.row{display:grid;grid-template-columns:52px 1fr;gap:7px;padding:2px 0}.row b{color:#e8c775;font-size:11px}.row:first-child span{font-family:"Noto Serif Hebrew","Times New Roman",serif;font-size:16px;direction:rtl;text-align:left}.row span{overflow-wrap:anywhere}@media(max-width:520px){body{padding-top:26px}.verse{gap:18px 8px;padding:0 6px}.popup{font-size:11px}}</style>'''
          js='''<script>const tokens=[...document.querySelectorAll('.token')];function place(t){const p=t.querySelector('.popup');p.classList.add('show');const r=t.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;let l=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2)),top=r.bottom+8;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-8);p.style.left=l+'px';p.style.top=top+'px'}function hide(t){if(t.dataset.locked!=='1')t.querySelector('.popup').classList.remove('show')}tokens.forEach(t=>{t.addEventListener('mouseenter',()=>{if(matchMedia('(hover:hover)').matches)place(t)});t.addEventListener('mouseleave',()=>hide(t));t.addEventListener('focus',()=>place(t));t.addEventListener('blur',()=>hide(t));t.addEventListener('click',e=>{e.stopPropagation();tokens.forEach(x=>{if(x!==t){x.dataset.locked='0';x.querySelector('.popup').classList.remove('show')}});t.dataset.locked=t.dataset.locked==='1'?'0':'1';if(t.dataset.locked==='1')place(t);else t.querySelector('.popup').classList.remove('show')})});document.addEventListener('click',()=>tokens.forEach(t=>{t.dataset.locked='0';t.querySelector('.popup').classList.remove('show')}));addEventListener('resize',()=>tokens.forEach(t=>{if(t.querySelector('.popup').classList.contains('show'))place(t)}));</script>'''
          for v in chapter:
              if not v.tag.endswith('verse'): continue
              n=int(v.get('osisID').split('.')[-1]); parts=[]
              for x in v:
                  tag=x.tag.rsplit('}',1)[-1]
                  if tag=='w':
                      word=(x.text or '').replace('/',''); lemma=x.get('lemma',''); morph=x.get('morph','')
                      ld=lemma_disp(lemma,morph); pd=pos_disp(morph); sd=stem_disp(morph)
                      gloss=ld.split(' + ')[-1]
                      parts.append(f'<span class="token" tabindex="0"><span class="hebrew" lang="he">{html.escape(word)}</span><span class="gloss">{html.escape(gloss)}</span><span class="popup" role="tooltip"><div class="row"><b>レンマ</b><span>{html.escape(ld)}</span></div><div class="row"><b>品詞</b><span>{html.escape(pd)}</span></div><div class="row"><b>語幹</b><span>{html.escape(sd)}</span></div><div class="row"><b>活用</b><span>MorphHB {html.escape(morph)}</span></div></span></span>')
                  elif tag=='seg':
                      typ=x.get('type',''); txt=(x.text or '')
                      if typ in {'x-maqqef','x-paseq','x-sof-pasuq','x-pe','x-samekh'} and txt: parts.append(f'<span class="punct" aria-hidden="true">{html.escape(txt)}</span>')
              doc='<!doctype html><html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>創世記22:'+str(n)+'</title>'+css+'</head><body><main class="verse" aria-label="創世記22章'+str(n)+'節 インターリニア">'+''.join(parts)+'</main>'+js+'</body></html>'
              (root/'html'/f'028-genesis-22-{n}-interactive.html').write_text(doc,encoding='utf-8')
          assert len(list((root/'html').glob('*.html')))==24
          PY
      - name: Commit generated HTML
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 028/html
          git commit -m '[028-html-built] Generate Genesis 22 interactive Hebrew HTML' || exit 0
          git push
