name: Build 030 Chayei Sara 2 audio repair

on:
  push:
    paths:
      - '.github/workflows/build-030-chayeisara2-audio-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Fetch authoritative mapping and PocketTorah source
        run: |
          set -euo pipefail
          mkdir -p 030/audio /tmp/030-audio
          curl -fL --retry 3 -o /tmp/030-audio/Chayei-Sara-2.json \
            'https://raw.githubusercontent.com/Sefaria/Sefaria-Project/master/data/tmp/pockettorah_audio/Chayei%20Sara-2.json'
          curl -fL --retry 3 -o /tmp/030-audio/ChayeiSara-2.mp3 \
            'https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/audio/ChayeiSara-2.mp3'
          test "$(git hash-object /tmp/030-audio/ChayeiSara-2.mp3)" = 'cb34459301921c8fb3513244e304cf95a080fac3'

      - name: Validate Genesis 23:18-20 mapping
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='/tmp/030-audio/Chayei-Sara-2.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['media_url']=='https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/audio/ChayeiSara-2.mp3'
          expected={
              'Genesis 23:18': (19.407702,25.626239),
              'Genesis 23:19': (25.626239,42.704283),
              'Genesis 23:20': (42.704283,53.600479),
          }
          got={x['sefaria_ref']:(float(x['start_time']),float(x['end_time'])) for x in d['ref']}
          for ref,(s,e) in expected.items():
              assert ref in got, ref
              gs,ge=got[ref]
              assert abs(gs-s)<1e-6 and abs(ge-e)<1e-6, (ref,got[ref],(s,e))
          PY

      - name: Split physical per-verse MP3 files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          source='/tmp/030-audio/ChayeiSara-2.mp3'
          cuts=[
              (18,19.407702,25.626239),
              (19,25.626239,42.704283),
              (20,42.704283,53.600479),
          ]
          for verse,start,end in cuts:
              duration=end-start
              out=f'030/audio/030-Genesis-23-{verse}-PocketTorah-r1.mp3'
              subprocess.run([
                  'ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y',
                  '-ss',f'{start:.6f}','-i',source,'-t',f'{duration:.6f}',
                  '-c:a','libmp3lame','-q:a','2',out
              ],check=True)
          PY

      - name: Verify generated durations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected={18:6.218537,19:17.078044,20:10.896196}
          for verse,exp in expected.items():
              fn=f'030/audio/030-Genesis-23-{verse}-PocketTorah-r1.mp3'
              p=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',fn],capture_output=True,text=True,check=True)
              actual=float(p.stdout.strip())
              assert abs(actual-exp)<0.15,(verse,exp,actual)
          PY

      - name: Commit generated audio
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 030/audio
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add 030 Genesis 23:18-20 PocketTorah verse audio r1'
            git push
          fi
