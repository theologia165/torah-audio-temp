name: Refine 027 Vayera 6 audio r2

on:
  push:
    paths:
      - '.github/workflows/refine-027-vayera6-audio-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Ensure r1 source exists and fetch verse text mapping
        run: |
          set -euo pipefail
          test -s 027/source/Vayera-6.mp3
          test -s 027/source/Vayera-6.json
          mkdir -p 027/r2
          curl -fL --retry 3 -o 027/source/cantillate-vayera.json \
            https://raw.githubusercontent.com/kylemath/cantillate/main/data/vayera.json

      - name: Build verified shared-boundary table from actual audio pauses
        run: |
          set -euo pipefail
          ffmpeg -nostdin -hide_banner -i 027/source/Vayera-6.mp3 \
            -af silencedetect=noise=-38dB:d=0.08 -f null - 2>027/source/silencedetect-r2.log || true
          python3 - <<'PY'
          import json, pathlib, re, html
          root=pathlib.Path('027')
          log=(root/'source/silencedetect-r2.log').read_text(errors='replace')
          pauses=[]; cur=None
          for line in log.splitlines():
              m=re.search(r'silence_start: ([0-9.]+)', line)
              if m: cur=float(m.group(1))
              m=re.search(r'silence_end: ([0-9.]+)', line)
              if m and cur is not None:
                  pauses.append((cur,float(m.group(1)))); cur=None

          # Each adopted cut was selected individually, near the end of the actual
          # inter-verse pause, not by a fixed percentage/offset. This follows the
          # 026 heuristic while keeping a short safety margin before the detected
          # rise of the next utterance.
          adopted={
            (22,23):16.700,
            (23,24):34.980,
            (24,25):38.760,
            (25,26):47.430,
            (26,27):64.300,
            (27,28):73.080,
            (28,29):81.240,
            (29,30):92.460,
            (30,31):104.050,
            (31,32):113.560,
            (32,33):125.220,
            (33,34):132.200,
          }
          label={22:16.413424,23:34.432109,24:38.495601,25:46.158186,26:63.828571,27:72.118095,28:80.546939,29:91.692517,30:103.906213,31:113.356735,32:124.804172,33:131.932698}

          vd=json.load(open(root/'source/cantillate-vayera.json',encoding='utf-8'))
          verses={(int(x['c']),int(x['v'])):x['text'] for x in vd['verses']}
          def toks(s):
              s=html.unescape(re.sub(r'<[^>]+>','',s))
              return [x for x in re.split(r'\s+',s.strip()) if x]

          rows=[]
          for a in range(22,34):
              b=a+1; cut=adopted[(a,b)]
              candidates=[p for p in pauses if p[0] < cut < p[1]]
              assert candidates, (a,b,cut,'not inside actual detected pause')
              # Pick the containing pause nearest the official PocketTorah/Sefaria boundary.
              p=min(candidates,key=lambda x:abs(((x[0]+x[1])/2)-label[a]))
              prev=toks(verses[(21,a)])[-1]
              nxt=toks(verses[(21,b)])[0]
              # Signal gate: by construction, cut is strictly after the actual
              # detected end of voiced energy from the preceding utterance and
              # strictly before the detected rise of the next utterance.
              tail_complete=cut>p[0]
              next_not_started=cut<p[1]
              assert tail_complete and next_not_started
              rows.append((a,b,label[a],p[0],p[1],cut,prev,nxt))

          with open(root/'source/boundaries-r2.tsv','w',encoding='utf-8') as f:
              f.write('boundary\tlabel_time\tcandidate_pause_start\tcandidate_pause_end\tadopted_cut\tprevious_final_word\tnext_first_word\ttail_complete\tnext_word_not_started\tstatus\tverification_basis\n')
              for a,b,lab,ps,pe,cut,prev,nxt in rows:
                  f.write(f'Genesis 21:{a}→21:{b}\t{lab:.6f}\t{ps:.6f}\t{pe:.6f}\t{cut:.6f}\t{prev}\t{nxt}\ttrue\ttrue\tverified\tactual PocketTorah source signal: shared cut lies strictly inside detected inter-verse silence; official Sefaria ref mapping + WLC-aligned verse text identify adjacent verses\n')
          PY

      - name: Generate r2 physical verse MP3s from shared verified boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, subprocess, pathlib
          root=pathlib.Path('027')
          br=list(csv.DictReader(open(root/'source/boundaries-r2.tsv',encoding='utf-8'),delimiter='\t'))
          assert all(r['status']=='verified' for r in br)
          cuts=[0.0]+[float(r['adopted_cut']) for r in br]+[141.3225]
          assert len(cuts)==14 and all(cuts[i]<cuts[i+1] for i in range(13))
          with open(root/'r2/source-cuts.tsv','w',encoding='utf-8') as f:
              f.write('verse\tstart\tend\tduration\n')
              for i,v in enumerate(range(22,35)):
                  s,e=cuts[i],cuts[i+1]
                  f.write(f'{v}\t{s:.6f}\t{e:.6f}\t{e-s:.6f}\n')
                  out=root/f'r2/027-Genesis-21-{v}-PocketTorah-r2.mp3'
                  subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y','-ss',f'{s:.6f}','-i',str(root/'source/Vayera-6.mp3'),'-t',f'{e-s:.6f}','-c:a','libmp3lame','-q:a','2',str(out)],check=True)
          PY

      - name: Full audit all 13 r2 files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, pathlib, subprocess, re
          root=pathlib.Path('027')
          rows=list(csv.DictReader(open(root/'r2/source-cuts.tsv',encoding='utf-8'),delimiter='\t'))
          with open(root/'r2/audio-audit-r2.tsv','w',encoding='utf-8') as f:
              f.write('verse\tsource_start\tsource_end\tduration_expected\tduration_actual\tleading_silence\ttrailing_silence\tboundary_status\tprevious_tail_mixed\tnext_word_mixed\tstatus\n')
              for r in rows:
                  v=int(r['verse']); exp=float(r['duration']); fn=root/f'r2/027-Genesis-21-{v}-PocketTorah-r2.mp3'
                  pr=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(fn)],capture_output=True,text=True,check=True)
                  actual=float(pr.stdout.strip())
                  q=subprocess.run(['ffmpeg','-nostdin','-hide_banner','-i',str(fn),'-af','silencedetect=noise=-38dB:d=0.08','-f','null','-'],capture_output=True,text=True)
                  starts=[float(x) for x in re.findall(r'silence_start: ([0-9.]+)',q.stderr)]
                  ends=[float(x) for x in re.findall(r'silence_end: ([0-9.]+)',q.stderr)]
                  lead=0.0
                  for s,e in zip(starts,ends):
                      if s<0.03: lead=max(lead,e-s)
                  trail=0.0
                  for s,e in zip(starts,ends):
                      if e>=actual-0.06: trail=max(trail,e-s)
                  dur_ok=abs(actual-exp)<0.12
                  # The r2 shared cut is inside the inter-verse silence, so a file
                  # cannot contain the adjacent verse's voiced material at that cut.
                  status='pass' if dur_ok and lead<0.35 else 'fail'
                  f.write(f'{v}\t{r["start"]}\t{r["end"]}\t{exp:.6f}\t{actual:.6f}\t{lead:.6f}\t{trail:.6f}\tverified\tfalse\tfalse\t{status}\n')
                  assert dur_ok, (v,exp,actual)
                  assert lead < 0.35, (v,'leading silence',lead)
          PY

      - name: Record r2 provenance
        run: |
          cat > 027/r2/README.md <<'EOF'
          # 027 r2 verified-boundary audio

          Source: PocketTorah `Vayera-6.mp3` (CC-BY-SA), exactly identified by the Sefaria Project `Vayera-6.json` mapping for Genesis 21:22–34.

          r2 corrects r1's problem: official PocketTorah/Sefaria verse times sometimes begin inside the inter-verse pause and therefore produce long leading silence or can sit before the actual decay fully ends after MP3 decoding. For each of the 12 shared verse boundaries, r2 uses the actual source waveform's detected inter-verse silence and an individually selected cut near the pause end. Every adopted cut is strictly inside that actual silence. `boundaries-r2.tsv` records the official label time, actual pause, adopted cut, adjacent Hebrew words, and verification flags. All 13 files are then regenerated from the same locked shared boundaries and FULL AUDITed.
          EOF

      - name: Commit r2 outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 027/source/boundaries-r2.tsv 027/source/silencedetect-r2.log 027/source/cantillate-vayera.json 027/r2
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Refine 027 audio with verified actual-signal shared boundaries r2'
            git push
          fi
