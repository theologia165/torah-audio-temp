name: Repair 024 audio boundaries r4 native

on:
  push:
    branches: [main]
    paths:
      - '024/repair_audio_r4_native.py'
      - '.github/workflows/repair-024-audio-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download PocketTorah source, official labels, and native Genesis text
        run: |
          curl -L --fail -o 024/Vayera-3.mp3 https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/audio/Vayera-3.mp3
          curl -L --fail -o 024/Vayera-3.txt https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/torah/labels/Vayera-3.txt
          curl -L --fail -o 024/Genesis-PocketTorah.json https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/torah/json/Genesis.json
      - name: Rebuild Genesis 19:4-20 from PocketTorah native verse word arrays
        run: python 024/repair_audio_r4_native.py | tee 024/repair-r4.log
      - name: Verify r4 files and native-data audit
        run: |
          test "$(find 024/audio -maxdepth 1 -name '024-Genesis-19-*-r4-study.mp3' | wc -l)" -eq 17
          test "$(find 024/audio-normal -maxdepth 1 -name '024-Genesis-19-*-r4.mp3' | wc -l)" -eq 17
          grep -q '^Genesis-19-4' 024/boundaries-r4-native.tsv
          grep -q '^Genesis-19-20' 024/boundaries-r4-native.tsv
          grep -q 'PASS:' 024/repair-r4.log
      - name: Commit repaired clips and native audit
        run: |
          rm -f 024/Vayera-3.mp3 024/Vayera-3.txt 024/Genesis-PocketTorah.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 024/audio/*-r4-study.mp3 024/audio-normal/*-r4.mp3 024/boundaries-r4-native.tsv 024/source/PocketTorah-Genesis-19-native.json 024/repair-r4.log
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Repair 024 Genesis 19:4-20 with PocketTorah native tokens r4'
            git pull --rebase origin main
            git push
          fi
