name: Repair 018 audio Genesis 14-17 to 14-20

on:
  push:
    branches: [main]
    paths:
      - '018/repair_audio_17_20.py'
      - '.github/workflows/repair-018-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download PocketTorah source audio
        run: curl -L --fail -o 018/Lech-Lecha-4.mp3 https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/audio/Lech-Lecha-4.mp3
      - name: Rebuild Genesis 14:17-20
        run: python 018/repair_audio_17_20.py
      - name: Commit repaired clips and boundaries
        run: |
          rm -f 018/Lech-Lecha-4.mp3
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 018/audio/018-Genesis-14-17-study.mp3 018/audio/018-Genesis-14-18-study.mp3 018/audio/018-Genesis-14-19-study.mp3 018/audio/018-Genesis-14-20-study.mp3 018/boundaries.tsv 018/boundary-repair-17-20.tsv
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Repair 018 Genesis 14:17-20 audio boundaries'
            git push
          fi
      - name: Confirm repair artifact
        run: test -s 018/boundary-repair-17-20.tsv
