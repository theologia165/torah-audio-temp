name: Repair 024 Genesis 19 audio

on:
  push:
    paths:
      - '.github/workflows/repair-024-audio.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[audio-r6]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Genesis 19:5-20 from measured source pauses
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cd 024
          test -f Vayera-3.mp3
          test -f Vayera-3.txt
          mkdir -p audio audio-normal
          ffmpeg -hide_banner -i Vayera-3.mp3 -af silencedetect=noise=-38dB:d=0.18 -f null - 2> /tmp/024-silence.log || true
          python3 - <<'PY'
          import re, pathlib, subprocess

          root=pathlib.Path('.')
          src=root/'Vayera-3.mp3'
          labels=[float(x) for x in (root/'Vayera-3.txt').read_text().strip().split(',') if x.strip()]
          # PocketTorah native Genesis 19 word counts already verified against the 321 labels.
          counts=[16,20,14,15,15,7,5,29,20,12,13,18,15,22,19,16,19,6,23,17]
          assert sum(counts)==len(labels)==321
          first=[]; i=0
          for c in counts:
              first.append(i); i+=c

          log=pathlib.Path('/tmp/024-silence.log').read_text(errors='ignore')
          starts=[float(x) for x in re.findall(r'silence_start: ([0-9.]+)',log)]
          ends=[float(x) for x in re.findall(r'silence_end: ([0-9.]+)',log)]
          sil=[]
          for s,e in zip(starts,ends):
              if e>s:
                  sil.append((s,e,(s+e)/2,e-s))

          def dur(p):
              return float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(p)],text=True).strip())
          total=dur(src)
          # User-confirmed perfect v4 uses midpoint of the measured 67.634-68.245 silence.
          fixed_v4_end=67.939450
          offset=fixed_v4_end-labels[first[4]]  # compare to v5 first-word label
          boundaries={4:fixed_v4_end}
          report=[]
          report.append('Genesis 19 / 024 r6 repair')
          report.append('v4 end fixed from user-confirmed r5: 67.939450')
          report.append(f'initial label-to-source offset={offset:.6f}s')
          report.append('Each later boundary: actual SOURCE silence midpoint nearest next-verse label + tracked offset; offset is then updated.')
          report.append('')

          # boundaries after verses 5..19, guided by the first word of verses 6..20.
          prev=fixed_v4_end
          for v in range(5,20):
              next_label=labels[first[v]]  # zero-based v => first word of verse v+1
              expected=next_label+offset
              # Do not allow an internal pause very near the previous boundary. Prefer substantial pauses.
              candidates=[x for x in sil if x[2] > prev+1.0 and abs(x[2]-expected)<=2.5 and x[3]>=0.20]
              if not candidates:
                  candidates=[x for x in sil if x[2] > prev+1.0 and abs(x[2]-expected)<=4.5 and x[3]>=0.16]
              if not candidates:
                  raise RuntimeError(f'No measured source pause for boundary after v{v}; expected {expected:.3f}')
              # Primary key: closeness to expected. A long pause wins when closeness is nearly tied.
              candidates.sort(key=lambda x:(abs(x[2]-expected), -x[3]))
              best=candidates[0]
              # If a >=0.35s pause lies within 0.45s of the closest candidate's distance, prefer it.
              strong=[x for x in candidates if x[3]>=0.35 and abs(x[2]-expected)<=abs(best[2]-expected)+0.45]
              if strong:
                  best=min(strong,key=lambda x:abs(x[2]-expected))
              s,e,mid,sdur=best
              boundaries[v]=mid
              old_offset=offset
              offset=mid-next_label
              report.append(f'after v{v:02d}: label(next v)={next_label:.6f} expected={expected:.6f} silence={s:.6f}-{e:.6f} dur={sdur:.3f} cut={mid:.6f} offset {old_offset:.6f}->{offset:.6f}')
              prev=mid

          boundaries[20]=total
          ATEMPO=0.739931
          # Generate 19:5-20 independently from the original source, never from previously split clips.
          for v in range(5,21):
              start=boundaries[v-1]
              end=boundaries[v]
              if end-start < 1.0:
                  raise RuntimeError(f'Implausibly short v{v}: {end-start:.3f}s')
              normal=root/'audio-normal'/f'024-Genesis-19-{v}-r6.mp3'
              study=root/'audio'/f'024-Genesis-19-{v}-r6-study.mp3'
              subprocess.run(['ffmpeg','-nostdin','-y','-hide_banner','-loglevel','error','-ss',f'{start:.6f}','-to',f'{end:.6f}','-i',str(src),'-vn','-ac','1','-codec:a','libmp3lame','-q:a','3',str(normal)],check=True)
              subprocess.run(['ffmpeg','-nostdin','-y','-hide_banner','-loglevel','error','-i',str(normal),'-filter:a',f'atempo={ATEMPO:.6f}','-codec:a','libmp3lame','-q:a','3',str(study)],check=True)
              report.append(f'v{v:02d}: source={start:.6f}-{end:.6f} normal={dur(normal):.3f}s study={dur(study):.3f}s')

          # Inspect generated leading/trailing silence; long leading gaps like the old v4 are forbidden.
          report.append('')
          report.append('Generated study-file silence audit:')
          for v in range(5,21):
              p=root/'audio'/f'024-Genesis-19-{v}-r6-study.mp3'
              proc=subprocess.run(['ffmpeg','-hide_banner','-i',str(p),'-af','silencedetect=noise=-38dB:d=0.18','-f','null','-'],stderr=subprocess.PIPE,stdout=subprocess.DEVNULL,text=True)
              txt=proc.stderr
              ss=[float(x) for x in re.findall(r'silence_start: ([0-9.]+)',txt)]
              ee=[float(x) for x in re.findall(r'silence_end: ([0-9.]+)',txt)]
              lead=0.0
              if ss and ss[0] <= 0.08 and ee:
                  lead=ee[0]
              report.append(f'v{v:02d}: leading_silence={lead:.3f}s')
              if lead>1.20:
                  raise RuntimeError(f'Long leading silence remains in v{v}: {lead:.3f}s')

          (root/'repair-r6.log').write_text('\n'.join(report)+'\n',encoding='utf-8')
          print('\n'.join(report))
          PY
      - name: Commit r6 audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 024/audio/024-Genesis-19-*-r6-study.mp3 024/audio-normal/024-Genesis-19-*-r6.mp3 024/repair-r6.log
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m '[audio-r6] Repair 024 Genesis 19:5-20 from measured source pauses'
          git push
