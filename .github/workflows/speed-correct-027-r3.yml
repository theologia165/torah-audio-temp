name: Speed-correct 027 PocketTorah audio r3

on:
  push:
    paths:
      - '.github/workflows/speed-correct-027-r3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  speed_correct:
    if: ${{ !contains(github.event.head_commit.message, '[027-r3-speed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: Compute 027 factor from words-per-second against accepted 026 study target
        shell: bash
        run: |
          set -euo pipefail
          test -s 027/r2/source-cuts.tsv
          for v in $(seq 22 34); do test -s "027/r2/027-Genesis-21-${v}-PocketTorah-r2.mp3"; done
          mkdir -p 027/r3
          curl -fL --retry 3 -o 027/source/cantillate-vayera-speed.json \
            https://raw.githubusercontent.com/kylemath/cantillate/main/data/vayera.json
          python3 - <<'PY'
          import json,re,html,csv,pathlib
          root=pathlib.Path('027')
          d=json.load(open(root/'source/cantillate-vayera-speed.json',encoding='utf-8'))
          verses=[x for x in d['verses'] if int(x['c'])==21 and 22<=int(x['v'])<=34]
          assert [int(x['v']) for x in verses]==list(range(22,35))
          def toks(s):
              s=html.unescape(re.sub(r'<[^>]+>','',s))
              return [t for t in re.split(r'\s+',s.strip()) if t]
          counts={int(x['v']):len(toks(x['text'])) for x in verses}
          rows=list(csv.DictReader(open(root/'r2/source-cuts.tsv',encoding='utf-8'),delimiter='\t'))
          source_seconds=sum(float(r['duration']) for r in rows)
          total_tokens=sum(counts[int(r['verse'])] for r in rows)
          source_wps=total_tokens/source_seconds
          target_wps=(232/196.885)*0.673028
          factor=target_wps/source_wps
          assert 0.50 < factor < 0.90, factor
          with open(root/'r3/speed-decision.tsv','w',encoding='utf-8') as f:
              f.write('metric\tvalue\n')
              f.write(f'027_total_tokens\t{total_tokens}\n')
              f.write(f'027_source_seconds\t{source_seconds:.6f}\n')
              f.write(f'027_source_wps\t{source_wps:.9f}\n')
              f.write('026_reference_tokens\t232\n')
              f.write('026_reference_seconds\t196.885000\n')
              f.write('026_reference_atempo\t0.673028\n')
              f.write(f'target_study_wps\t{target_wps:.9f}\n')
              f.write(f'027_atempo\t{factor:.9f}\n')
          with open(root/'r3/token-counts.tsv','w',encoding='utf-8') as f:
              f.write('verse\ttokens\n')
              for v in range(22,35): f.write(f'{v}\t{counts[v]}\n')
          pathlib.Path(root/'r3/atempo.txt').write_text(f'{factor:.9f}\n',encoding='utf-8')
          print(f'027 total_tokens={total_tokens} source_seconds={source_seconds:.6f} source_wps={source_wps:.9f}')
          print(f'target_study_wps={target_wps:.9f} factor={factor:.9f}')
          PY

      - name: Generate speed-corrected r3 from locked verified r2 files
        shell: bash
        run: |
          set -euo pipefail
          factor=$(cat 027/r3/atempo.txt)
          for v in $(seq 22 34); do
            in="027/r2/027-Genesis-21-${v}-PocketTorah-r2.mp3"
            out="027/r3/027-Genesis-21-${v}-PocketTorah-r3-study.mp3"
            ffmpeg -hide_banner -loglevel error -nostdin -y -i "$in" \
              -filter:a "atempo=${factor}" -codec:a libmp3lame -q:a 2 "$out"
          done

      - name: Full audit speed-corrected files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,pathlib,subprocess,re
          root=pathlib.Path('027')
          cuts={int(r['verse']):r for r in csv.DictReader(open(root/'r2/source-cuts.tsv',encoding='utf-8'),delimiter='\t')}
          factor=float((root/'r3/atempo.txt').read_text())
          with open(root/'r3/audio-audit-r3.tsv','w',encoding='utf-8') as f:
              f.write('verse\tr2_duration\texpected_r3_duration\tactual_r3_duration\tleading_silence_ge_0.45\tstatus\n')
              for v in range(22,35):
                  fn=root/f'r3/027-Genesis-21-{v}-PocketTorah-r3-study.mp3'
                  r2=float(cuts[v]['duration'])
                  exp=r2/factor
                  p=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(fn)],capture_output=True,text=True,check=True)
                  actual=float(p.stdout.strip())
                  q=subprocess.run(['ffmpeg','-hide_banner','-nostdin','-i',str(fn),'-af','silencedetect=noise=-38dB:d=0.45','-f','null','-'],capture_output=True,text=True)
                  lead=bool(re.search(r'silence_start: 0(?:\.0*)?(?:\s|$)',q.stderr))
                  ok=abs(actual-exp)<0.20 and not lead
                  f.write(f'{v}\t{r2:.6f}\t{exp:.6f}\t{actual:.6f}\t{str(lead).lower()}\t{"pass" if ok else "fail"}\n')
                  assert ok,(v,r2,exp,actual,lead)
          PY

      - name: Record provenance
        shell: bash
        run: |
          cat > 027/r3/README.md <<'EOF'
          # 027 r3 speed-corrected study audio

          The verified r2 per-verse files are the immutable boundary source. No boundary is recalculated in r3.
          The study-speed factor is calculated from 027 PocketTorah text tokens per source second and matched to the accepted 026 study-speed target. It is not a fixed 65.4% rule.
          `speed-decision.tsv` records the calculation; `audio-audit-r3.tsv` records all 13 post-conversion checks.
          EOF

      - name: Commit r3
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 027/r3 027/source/cantillate-vayera-speed.json
          git commit -m '[027-r3-speed] Speed-correct 027 from locked r2 boundaries' || exit 0
          git push

