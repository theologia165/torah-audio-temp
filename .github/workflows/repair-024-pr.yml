name: Repair 024 Genesis 19 audio PR

on:
  pull_request:
    paths:
      - '024-repair-trigger.txt'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download PocketTorah source and official labels
        run: |
          curl -L --fail -o 024/Vayera-3.mp3 https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/audio/Vayera-3.mp3
          curl -L --fail -o 024/Vayera-3.txt https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/torah/labels/Vayera-3.txt
      - name: Rebuild all Genesis 19:1-20 clips from source
        run: python 024/repair_all_audio_r2.py | tee 024/repair-r2.log
      - name: Verify repaired set
        run: |
          test "$(find 024/audio -maxdepth 1 -name '024-Genesis-19-*-r2-study.mp3' | wc -l)" -eq 20
          test "$(find 024/audio-normal -maxdepth 1 -name '024-Genesis-19-*-r2.mp3' | wc -l)" -eq 20
          grep -q '^Genesis-19-1' 024/boundaries-r2.tsv
          grep -q '^Genesis-19-20' 024/boundaries-r2.tsv
          grep -q 'PASS:' 024/repair-r2.log
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-024-audio-r2
          path: |
            024/audio/*-r2-study.mp3
            024/audio-normal/*-r2.mp3
            024/boundaries-r2.tsv
            024/boundary-repair-r2.tsv
            024/repair-r2.log
          retention-days: 1
