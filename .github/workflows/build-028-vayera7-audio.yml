name: Build 028 Vayera 7 study audio

on:
  push:
    paths:
      - '.github/workflows/build-028-vayera7-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[028-audio-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Fetch PocketTorah source and authoritative verse mapping
        run: |
          set -euo pipefail
          mkdir -p 028/source 028/r3
          curl -fL --retry 3 -o 028/source/Vayera-7.json https://raw.githubusercontent.com/Sefaria/Sefaria-Project/master/data/tmp/pockettorah_audio/Vayera-7.json
          curl -fL --retry 3 -o 028/source/Vayera-7.mp3 https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/audio/Vayera-7.mp3

      - name: Split Genesis 22:1-24 and create study-speed files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('028')
          d=json.load(open(root/'source/Vayera-7.json',encoding='utf-8'))
          refs=d['ref']
          expected=[f'Genesis 22:{v}' for v in range(1,25)]
          got=[x['sefaria_ref'] for x in refs]
          assert got==expected,(got,expected)
          assert d['media_url']=='https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/audio/Vayera-7.mp3'
          factor=0.812158348
          lines=['verse\tstart\tend\tsource_duration\tstudy_atempo\toutput']
          for v,x in enumerate(refs,1):
              s=float(x['start_time']); e=float(x['end_time']); dur=e-s
              assert dur>0
              raw=root/f'source/028-Genesis-22-{v}-raw.mp3'
              out=root/f'r3/028-Genesis-22-{v}-PocketTorah-r3-study.mp3'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-y','-ss',f'{s:.6f}','-i',str(root/'source/Vayera-7.mp3'),'-t',f'{dur:.6f}','-c:a','libmp3lame','-q:a','2',str(raw)],check=True)
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-y','-i',str(raw),'-filter:a',f'atempo={factor}','-c:a','libmp3lame','-q:a','2',str(out)],check=True)
              raw.unlink()
              lines.append(f'{v}\t{s:.6f}\t{e:.6f}\t{dur:.6f}\t{factor:.9f}\t{out.name}')
          (root/'r3/verse-map.tsv').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          cat > 028/r3/README.md <<'EOF'
          # 028 Genesis 22:1-24 study audio
          Source: PocketTorah `Vayera-7.mp3` (CC-BY-SA).
          Verse boundaries: Sefaria Project `data/tmp/pockettorah_audio/Vayera-7.json`.
          Each verse is physically split before time-stretching; no `#t=` media fragments are used.
          Study playback factor: 0.812158348, matching the accepted 027 study-speed processing.
          EOF

      - name: Commit 028 audio
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 028
          git commit -m '[028-audio-built] Build Genesis 22:1-24 PocketTorah study audio' || exit 0
          git push
